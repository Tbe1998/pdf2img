name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  POPPLER_VERSION: "26.09.0-0"
  APP_NAME: "PDF2Image.exe"

jobs:
  # 1) 跨平台逻辑单测（版本比较 / 页码范围 / 命名规则）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test -v ./...

  # 2) Windows 构建：嵌图标 → 装 poppler → 自检真实转一张图 → 打包
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 安装 rsrc（把 app.ico 嵌进 exe）
        run: go install github.com/akavel/rsrc@latest

      - name: 生成图标资源
        run: rsrc -ico app.ico -o rsrc_windows_amd64.syso

      - name: 下载并裁剪 poppler
        shell: pwsh
        run: |
          $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v$env:POPPLER_VERSION/Release-$env:POPPLER_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile poppler.zip -UseBasicParsing
          Expand-Archive poppler.zip -DestinationPath poppler -Force
          $src = (Get-ChildItem poppler -Directory | Select-Object -First 1).FullName + "\Library\bin"
          New-Item -ItemType Directory -Force bin | Out-Null
          Get-Content tools\poppler-files.txt | ForEach-Object {
            $f = Join-Path $src $_.Trim()
            if (Test-Path $f) { Copy-Item $f bin\ } else { Write-Error "缺少 poppler 文件：$_" }
          }
          Get-ChildItem bin | Measure-Object -Property Length -Sum |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Sum/1MB,1)}}

      # 控制台版自检：用随包 poppler 真转一张图，退出码 0 才算过
      - name: 构建自检版
        run: go build -trimpath -ldflags "-s -w" -o selftest.exe .

      - name: 冒烟自检（临时目录里造 PDF → 转 PNG → 核对产物）
        run: .\selftest.exe --selftest-console

      - name: 构建主程序
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o $env:APP_NAME .

      - name: 打包（exe + bin\poppler + 说明）
        shell: pwsh
        run: |
          $ver = 'dev'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $ver = $env:GITHUB_REF -replace 'refs/tags/v', '' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $env:APP_NAME out\
          Copy-Item bin out\bin -Recurse
          Copy-Item 使用说明.txt, README.md out\ -ErrorAction SilentlyContinue
          Compress-Archive -Path out\* -DestinationPath "PDF2Image-v$ver.zip" -Force
          Get-Item "PDF2Image-v$ver.zip" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: PDF2Image-windows-x64
          path: PDF2Image-v*.zip
          retention-days: 30

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes "由 GitHub Actions 自动构建"
          }
          gh release upload ${{ github.ref_name }} (Get-Item PDF2Image-v*.zip).Name --clobber
